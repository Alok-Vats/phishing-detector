<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Phishing Shield</h2>
    <div id="url-display">Checking URL...</div>
    
    <div id="loading" class="state-container">
      <div class="spinner"></div>
      <p>Analyzing via AI engine...</p>
    </div>

    <div id="error" class="state-container hidden">
      <div class="icon">❌</div>
      <p id="error-message">Could not reach the analysis server.</p>
      <button id="settings-btn">Set API URL</button>
    </div>

    <div id="result" class="hidden">
      <div class="score-card" id="score-card">
        <h3 id="classification">...</h3>
        <div class="score"><span id="risk-score">0</span> / 100</div>
        <p class="confidence">Confidence: <span id="confidence">0</span>%</p>
      </div>

      <div class="indicators">
        <h4>Key Indicators:</h4>
        <ul id="indicator-list"></ul>
      </div>
      
      <div class="indicators" id="threat-intel-box" style="display: none;">
        <h4>Threat Intel:</h4>
        <ul id="intel-list"></ul>
      </div>
    </div>
    
    <div id="settings" class="hidden" style="margin-top: 15px; border-top: 1px solid #475569; padding-top: 10px;">
        <label>API Base URL:</label>
        <input type="text" id="api-url" value="http://127.0.0.1:5000" style="width: 100%; padding: 5px; margin-top: 5px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        
        <label>API Token (optional):</label>
        <input type="password" id="api-token" placeholder="Bearer token..." style="width: 100%; padding: 5px; margin-top: 5px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: white;">
        
        <button id="save-settings" style="width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Save & Retry</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
